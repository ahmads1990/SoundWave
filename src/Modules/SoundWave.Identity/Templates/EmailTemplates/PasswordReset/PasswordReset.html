<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Password Reset</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div
        style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="color: #2c3e50; margin: 0;">Password Reset</h1>
        </div>

        <div style="color: #34495e; line-height: 1.6;">
            <p>You have requested to reset your password. Please use the following One-Time Password (OTP) to reset it:
            </p>

            <div
                style="background-color: #f8f9fa; border-left: 4px solid #3498db; padding: 15px; margin: 20px 0; text-align: center;">
                <span style="font-size: 24px; font-weight: bold; letter-spacing: 5px; color: #2c3e50;">{{Otp}}</span>
            </div>

            <p>This code is valid for {{ExpiresIn}}. If you did not request a password reset, please ignore this email.</p>
        </div>
    </div>
</body>

</html>
